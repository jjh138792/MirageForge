<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>蜃楼工坊 · MirageForge v2.0</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <div class="brand-wrap">
        <div class="logo-badge">蜃</div>
        <div>
          <h1>蜃楼工坊 <span class="ver-tag">v2.0 Engine</span></h1>
          <p class="subtitle">Zygisk API v4 · 虚拟句柄池 · memfd 文件盾</p>
        </div>
      </div>
      <div class="stat-pill" id="statusPill">就绪</div>
    </header>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="tab-templates">机型模板库</button>
      <button class="tab-btn" data-tab="tab-parser">一键解析 .prop</button>
      <button class="tab-btn" data-tab="tab-apps">应用分流矩阵</button>
    </nav>

    <!-- 页面 1：机型模板库 -->
    <main id="tab-templates" class="tab-panel active">
      <div class="section-header">
        <h2>全息机型模板</h2>
        <button class="btn-primary" id="btnNewTemplate">+ 新建全息模板</button>
      </div>
      <div id="templateList" class="card-grid"></div>
    </main>

    <!-- 页面 2：一键解析 .prop -->
    <main id="tab-parser" class="tab-panel">
      <div class="glass-card">
        <h2>深度解析 build.prop (支持全量属性穿透)</h2>
        <p class="hint-text">上传或粘贴任意 ROM 提取的 <code>build.prop</code>，引擎会自动提取机型、SoC、安全补丁、指纹，并将剩余所有厂商专属属性（如 <code>ro.miui.*</code>、<code>ro.oplus.*</code>）自动归入底层附加属性池。</p>
        
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="propFileInput" accept=".prop,.txt,.conf,*/*" hidden />
          <div class="upload-icon">🧬</div>
          <div class="upload-title">点击导入本地 .prop 文件</div>
          <div class="upload-sub">自动识别 system / vendor / odm / product 多分区属性</div>
        </div>

        <textarea id="propRawText" rows="8" placeholder="在此粘贴 build.prop 内容...&#10;ro.product.brand=Xiaomi&#10;ro.product.model=2410DPN6CC&#10;ro.soc.manufacturer=Qualcomm&#10;ro.soc.model=SM8750-AB&#10;ro.build.version.release=15&#10;ro.build.version.sdk=35"></textarea>

        <div class="action-row">
          <button class="btn-secondary" id="btnClearProp">清空</button>
          <button class="btn-primary" id="btnParseProp">⚡ 深度解析并生成模板</button>
        </div>
      </div>
    </main>

    <!-- 页面 3：应用分流绑定 -->
    <main id="tab-apps" class="tab-panel">
      <div class="filter-bar glass-card">
        <input type="text" id="appSearchInput" placeholder="🔍 搜索应用包名 (如 com.tencent.tmgp.sgame)..." />
        <div class="filter-chips">
          <button class="chip active" data-filter="all">全部应用</button>
          <button class="chip" data-filter="configured">仅已伪装</button>
          <button class="chip" id="btnRefreshApps">🔄 刷新包列表</button>
        </div>
      </div>
      <div id="appList" class="app-list"></div>
    </main>
  </div>

  <!-- 机型编辑/新建弹窗 -->
  <div class="modal-backdrop" id="templateModal">
    <div class="modal-card">
      <h3 id="modalTitle">编辑全息机型模板</h3>
      <input type="hidden" id="tplId" />
      <div class="form-grid">
        <label class="full-width">模板显示名称 *
          <input type="text" id="tplName" placeholder="例如：Xiaomi 15 Pro (澎湃 OS 2)" />
        </label>
        <label>手机型号 (MODEL) *
          <input type="text" id="tplModel" placeholder="2410DPN6CC" />
        </label>
        <label>品牌 (BRAND) *
          <input type="text" id="tplBrand" placeholder="Xiaomi" />
        </label>
        <label>制造商 (MANUFACTURER)
          <input type="text" id="tplManufacturer" placeholder="Xiaomi" />
        </label>
        <label>设备代号 (DEVICE)
          <input type="text" id="tplDevice" placeholder="haotian" />
        </label>
        <label>产品名称 (PRODUCT)
          <input type="text" id="tplProduct" placeholder="haotian" />
        </label>
        <label>主板平台 (BOARD)
          <input type="text" id="tplBoard" placeholder="sun" />
        </label>
        <label>硬件标识 (HARDWARE)
          <input type="text" id="tplHardware" placeholder="qcom" />
        </label>
        <label>SoC 制造商 (SOC_MANUFACTURER)
          <input type="text" id="tplSocMan" placeholder="Qualcomm" />
        </label>
        <label>SoC 型号 (SOC_MODEL)
          <input type="text" id="tplSocModel" placeholder="SM8750-AB" />
        </label>
        <label>版本号 (BUILD_ID)
          <input type="text" id="tplBuildId" placeholder="AP3A.240905.015.A2" />
        </label>
        <label>Android 版本 (RELEASE)
          <input type="text" id="tplRelease" placeholder="15" />
        </label>
        <label>API 级别 (SDK_INT)
          <input type="text" id="tplSdk" placeholder="35" />
        </label>
        <label class="full-width">安全补丁日期 (SECURITY_PATCH)
          <input type="text" id="tplPatch" placeholder="2025-02-01" />
        </label>
        <label class="full-width">设备指纹 (FINGERPRINT)
          <input type="text" id="tplFingerprint" placeholder="Xiaomi/haotian/haotian:15/..." />
        </label>
        <label class="full-width">
          <span><input type="checkbox" id="tplMemfd" checked /> 启用 <code>memfd_create</code> 虚拟 <code>/system/build.prop</code> 文件重定向盾</span>
        </label>
        <label class="full-width">附加底层属性池 (KEY=VALUE 每行一条，由虚拟 prop_info 句柄注入)
          <textarea id="tplCustomProps" rows="4" placeholder="ro.miui.ui.version.name=V816&#10;ro.product.marketname=Xiaomi 15 Pro"></textarea>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelModal">取消</button>
        <button class="btn-primary" id="btnSaveTemplate">保存并重编译配置</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
