<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="violet" data-refraction="standard">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060913" />
  <title>MirageForge · 蜃楼工坊</title>
  <link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/insets.css" />
  <link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/colors.css" />
</head>
<body>
  <!--
    纯单通道无损 feDisplacementMap + userSpaceOnUse 1:1 真实 CSS 像素坐标：
    彻底消除 feBlend 半透明 Alpha 叠加导致的发黑发灰，100% 保留晶莹剔透的光学质感
  -->
  <svg style="position: fixed; width: 0; height: 0; pointer-events: none; z-index: -999;" aria-hidden="true">
    <defs>
      <!-- 1. 整条底栏玻璃本体：透视下方页面并在边缘弧面产生拉伸扭曲 -->
      <filter
        id="mirage-dock-lens"
        filterUnits="userSpaceOnUse"
        primitiveUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="360"
        height="64"
        color-interpolation-filters="sRGB"
      >
        <feFlood flood-color="rgb(128,128,128)" result="dockNeutral" />
        <feImage
          id="mirage-dock-map"
          x="0"
          y="0"
          width="360"
          height="64"
          preserveAspectRatio="none"
          result="dockRawMap"
        />
        <feComposite in="dockRawMap" in2="dockNeutral" operator="over" result="dockMap" />
        <feDisplacementMap
          id="mirage-dock-disp"
          in="SourceGraphic"
          in2="dockMap"
          scale="24"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>

      <!-- 2. 液滴滑块泡：单通道无损高透折射（中心 0 位移清晰，外圈弧壁强 Snell 弯曲拉伸） -->
      <filter
        id="mirage-orb-lens"
        filterUnits="userSpaceOnUse"
        primitiveUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="108"
        height="52"
        color-interpolation-filters="sRGB"
      >
        <feFlood flood-color="rgb(128,128,128)" result="orbNeutral" />
        <feImage
          id="mirage-spherical-map"
          x="0"
          y="0"
          width="108"
          height="52"
          preserveAspectRatio="none"
          result="orbRawMap"
        />
        <feComposite in="orbRawMap" in2="orbNeutral" operator="over" result="lensMap" />
        <feDisplacementMap
          id="mirage-orb-disp"
          in="SourceGraphic"
          in2="lensMap"
          scale="28"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </defs>
  </svg>

  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
