<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="violet" data-refraction="standard">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060913" />
  <title>MirageForge · 蜃楼工坊</title>
  <link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/insets.css" />
  <link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/colors.css" />
</head>
<body>
  <!--
    三图双态光学引擎 (userSpaceOnUse 1:1 像素对齐 + 无损单通道折射)：
    1. #mirage-dock-lens：整条底栏全域曲面拉伸（透视并拉伸背后所有内容）
    2. #mirage-orb-lens：内置 domeMap（静止全域拉伸）与 rimMap（交互仅拉边缘），
       通过 feComposite(arithmetic) 随弹簧实时连续插值变形，0 闪烁、0 明暗跳变
  -->
  <svg style="position: fixed; width: 0; height: 0; pointer-events: none; z-index: -999;" aria-hidden="true">
    <defs>
      <!-- 1. 整条底栏全域曲面拉伸滤镜 -->
      <filter
        id="mirage-dock-lens"
        filterUnits="userSpaceOnUse"
        primitiveUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="360"
        height="64"
        color-interpolation-filters="sRGB"
      >
        <feFlood flood-color="rgb(128,128,128)" result="dockNeutral" />
        <feImage
          id="mirage-dock-map"
          x="0"
          y="0"
          width="360"
          height="64"
          preserveAspectRatio="none"
          result="dockRawMap"
        />
        <feComposite in="dockRawMap" in2="dockNeutral" operator="over" result="dockMap" />
        <feDisplacementMap
          id="mirage-dock-disp"
          in="SourceGraphic"
          in2="dockMap"
          scale="26"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>

      <!-- 2. 液态玻璃泡双态连续变形滤镜（静止=全域凸面拉伸 <-> 交互=仅拉边缘） -->
      <filter
        id="mirage-orb-lens"
        filterUnits="userSpaceOnUse"
        primitiveUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="108"
        height="52"
        color-interpolation-filters="sRGB"
      >
        <feFlood flood-color="rgb(128,128,128)" result="orbNeutral" />

        <!-- 静止态法线图：全域凸面拉伸背后全部内容 -->
        <feImage
          id="mirage-orb-dome-map"
          x="0"
          y="0"
          width="108"
          height="52"
          preserveAspectRatio="none"
          result="domeRaw"
        />
        <feComposite in="domeRaw" in2="orbNeutral" operator="over" result="domeMap" />

        <!-- 交互态法线图：中心 0 畸变清澈，仅边缘弧壁强力弯曲拉伸 -->
        <feImage
          id="mirage-orb-rim-map"
          x="0"
          y="0"
          width="108"
          height="52"
          preserveAspectRatio="none"
          result="rimRaw"
        />
        <feComposite in="rimRaw" in2="orbNeutral" operator="over" result="rimMap" />

        <!-- 实时线性插值混合：k2 = 1 - t (静止全域), k3 = t (交互边缘) -->
        <feComposite
          id="mirage-orb-morph"
          in="domeMap"
          in2="rimMap"
          operator="arithmetic"
          k1="0"
          k2="1"
          k3="0"
          k4="0"
          result="lensMap"
        />

        <feDisplacementMap
          id="mirage-orb-disp"
          in="SourceGraphic"
          in2="lensMap"
          scale="18"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </defs>
  </svg>

  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
