<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-accent="violet" data-refraction="standard">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#060913" />
  <title>MirageForge · 蜃楼工坊</title>
  <link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/insets.css" />
  <link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/colors.css" />
</head>
<body>
  <!--
    三独立单通道无损折射滤镜 (userSpaceOnUse 1:1 真实 CSS 像素对齐)：
    1. #mirage-dock-lens：整条底栏全域拉伸背后页面（配合柔焦磨砂）
    2. #mirage-orb-dome-lens：静止泡（位于图标下层），全域凸面拉伸背后页面（配合柔焦磨砂，绝不拉歪图标）
    3. #mirage-orb-rim-lens：交互泡（位于图标上层），0 模糊、仅边缘弧壁弯曲拉伸
  -->
  <svg style="position: fixed; width: 0; height: 0; pointer-events: none; z-index: -999;" aria-hidden="true">
    <defs>
      <!-- 1. 整条底栏全域拉伸 -->
      <filter
        id="mirage-dock-lens"
        filterUnits="userSpaceOnUse"
        primitiveUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="360"
        height="64"
        color-interpolation-filters="sRGB"
      >
        <feFlood flood-color="rgb(128,128,128)" result="dockNeutral" />
        <feImage
          id="mirage-dock-map"
          x="0"
          y="0"
          width="360"
          height="64"
          preserveAspectRatio="none"
          result="dockRaw"
        />
        <feComposite in="dockRaw" in2="dockNeutral" operator="over" result="dockMap" />
        <feDisplacementMap
          id="mirage-dock-disp"
          in="SourceGraphic"
          in2="dockMap"
          scale="24"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>

      <!-- 2. 静止态泡（图标下层）：全域凸面拉伸背后所有内容 -->
      <filter
        id="mirage-orb-dome-lens"
        filterUnits="userSpaceOnUse"
        primitiveUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="108"
        height="52"
        color-interpolation-filters="sRGB"
      >
        <feFlood flood-color="rgb(128,128,128)" result="domeNeutral" />
        <feImage
          id="mirage-orb-dome-map"
          x="0"
          y="0"
          width="108"
          height="52"
          preserveAspectRatio="none"
          result="domeRaw"
        />
        <feComposite in="domeRaw" in2="domeNeutral" operator="over" result="domeMap" />
        <feDisplacementMap
          id="mirage-orb-dome-disp"
          in="SourceGraphic"
          in2="domeMap"
          scale="20"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>

      <!-- 3. 交互态泡（图标上层）：0 模糊，中心清澈、仅外圈弧壁强力弯曲拉伸 -->
      <filter
        id="mirage-orb-rim-lens"
        filterUnits="userSpaceOnUse"
        primitiveUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="108"
        height="52"
        color-interpolation-filters="sRGB"
      >
        <feFlood flood-color="rgb(128,128,128)" result="rimNeutral" />
        <feImage
          id="mirage-orb-rim-map"
          x="0"
          y="0"
          width="108"
          height="52"
          preserveAspectRatio="none"
          result="rimRaw"
        />
        <feComposite in="rimRaw" in2="rimNeutral" operator="over" result="rimMap" />
        <feDisplacementMap
          id="mirage-orb-rim-disp"
          in="SourceGraphic"
          in2="rimMap"
          scale="30"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </defs>
  </svg>

  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
