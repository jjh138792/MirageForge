name: Build MirageForge Zygisk Module

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-zygisk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Fetch Latest zygisk.hpp (API v4)
        run: |
          if [ ! -f "zygisk/src/main/cpp/zygisk.hpp" ]; then
            curl -sSL https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp \
              -o zygisk/src/main/cpp/zygisk.hpp
          fi

      - name: Compile Zygisk Native Libraries (All ABIs)
        run: |
          mkdir -p module/zygisk
          ABIS=("arm64-v8a" "armeabi-v7a" "x86_64" "x86")
          for ABI in "${ABIS[@]}"; do
            echo "Building ABI: $ABI"
            cmake -B build/$ABI \
              -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              zygisk/src/main/cpp
            cmake --build build/$ABI --config Release
            cp build/$ABI/libmirage_forge.so module/zygisk/$ABI.so
          done

      - name: Package Flashable Magisk/KSU/Recovery Zip
        run: |
          chmod +x module/META-INF/com/google/android/update-binary
          chmod +x module/customize.sh module/uninstall.sh
          cd module
          zip -r9 ../MirageForge-Zygisk-v1.0.0.zip . -x "*.DS_Store"

      - name: Upload Flashable Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirageForge-Zygisk-Module
          path: MirageForge-Zygisk-v1.0.0.zip
