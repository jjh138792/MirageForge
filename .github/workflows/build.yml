name: Build MirageForge v4.0 Hypervisor

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-zygisk-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Fetch Official zygisk.hpp (API v4)
        run: |
          mkdir -p zygisk/src/main/cpp/include
          if [ ! -f "zygisk/src/main/cpp/include/zygisk.hpp" ]; then
            curl -sSL https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp \
              -o zygisk/src/main/cpp/include/zygisk.hpp
          fi

      - name: Build Native Hypervisor Libraries (All 4 ABIs)
        run: |
          mkdir -p module/zygisk
          ABIS=("arm64-v8a" "armeabi-v7a" "x86_64" "x86")
          for ABI in "${ABIS[@]}"; do
            echo ">>> Compiling MirageForge v4.0 for $ABI..."
            cmake -B build/$ABI \
              -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              zygisk/src/main/cpp
            cmake --build build/$ABI --config Release --parallel $(nproc)
            cp -f build/$ABI/libmirage_forge.so module/zygisk/$ABI.so
          done

      - name: Package Flashable Module Zip (Manager + Recovery)
        run: |
          chmod +x module/META-INF/com/google/android/update-binary
          chmod +x module/customize.sh module/action.sh module/uninstall.sh
          cd module
          zip -r9 ../MirageForge-Zygisk-v4.0.0.zip . -x "*.DS_Store"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirageForge-Zygisk-v4.0.0
          path: MirageForge-Zygisk-v4.0.0.zip
